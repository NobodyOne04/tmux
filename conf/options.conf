# Behaviour. Nothing here draws anything (see theme.conf).

# ---------- terminal ----------
set  -g default-terminal 'tmux-256color'
set -as terminal-features ',*:RGB'               # true colour
set -as terminal-features ',*:usstyle'           # undercurl + coloured underlines (nvim diagnostics)
set -as terminal-features ',*:clipboard'         # copy to the system clipboard via OSC 52
set -as terminal-features ',*:extkeys'           # Ctrl-Enter, Shift-Enter… reach nvim
set  -s extended-keys on
set  -s extended-keys-format csi-u
set  -g allow-passthrough on                     # images from nvim (image.nvim, molten) and Ghostty/kitty graphics
set  -s set-clipboard on                         # works the same on macOS, Wayland and over ssh

# ---------- nvim ----------
set -sg escape-time 10                           # Esc without delay
set  -g focus-events on                          # autoread when you come back to a pane

# ---------- windows & panes ----------
set  -g base-index 1                             # 1 is under your finger, 0 is not
setw -g pane-base-index 1
set  -g renumber-windows on                      # no gaps after closing a window
setw -g automatic-rename on                      # name = program, or the folder when it's the shell
setw -g automatic-rename-format '#{?#{m/r:^(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'
setw -g aggressive-resize on                     # a small client only shrinks the windows it looks at
set  -g detach-on-destroy off                    # closing a session's last window moves you to another session

# ---------- input ----------
set  -g mouse on                                 # click, drag borders, scroll; drag-select copies
set  -g mode-keys vi                             # vi keys in copy mode
set  -g status-keys emacs                        # the : prompt behaves like your shell
set  -g repeat-time 400

# ---------- history & messages ----------
set  -g history-limit 100000
set  -g display-time 2000
set  -g display-panes-time 2000
set  -g status-interval 5

# ---------- titles, bells ----------
set  -g set-titles on
set  -g set-titles-string '#S · #W'               # terminal tab title
set  -g bell-action other                        # bells from other windows show in the status bar
set  -g visual-bell off
set  -g visual-activity off
setw -g monitor-activity off
