# archminimal look: one cyan accent, transparent background (Ghostty / kitty
# blur shows through), status bar on top so it never meets nvim's at the bottom.
#
# palette   bg #18191d  fg #d0d2d0  dim #7d8088  muted #4a4c54  line #3a3c44
#           cyan #00e5ff  yellow #e0af68  red #ff2a6d  purple #b48ef7  green #9ece6a

set -g status on
set -g status-position top
set -g status-justify left
set -g status-style 'bg=default,fg=#7d8088'
set -g status-left-length 40
set -g status-right-length 120

# session: cyan normally · yellow after the prefix · purple in copy mode · red while typing into all panes
set -g status-left "#{?client_prefix,#[fg=#e0af68],#{?pane_in_mode,#[fg=#b48ef7],#{?pane_synchronized,#[fg=#ff2a6d],#[fg=#00e5ff]}}}#[bold] #S#[nobold]#{?client_prefix, ⌨,}#{?pane_in_mode, copy,}#{?pane_synchronized, sync,} #[fg=#3a3c44]│"

# windows: number + program (or folder); zoom and bell marks
set -g window-status-separator ''
set -g window-status-format         '#[fg=#4a4c54] #I #[fg=#7d8088]#W#{?window_zoomed_flag,#[fg=#4a4c54] 󰊓,}#{?window_bell_flag,#[fg=#ff2a6d] 󰂞,} '
set -g window-status-current-format '#[fg=#00e5ff,bold] #I #[fg=#d0d2d0,nobold]#W#{?window_zoomed_flag,#[fg=#00e5ff] 󰊓,} '

# right: git branch of the active pane · its folder · host · time
set -g status-right "#[fg=#9ece6a]#(git -C '#{pane_current_path}' branch --show-current 2>/dev/null | sed 's/^/ /') #[fg=#3a3c44]│ #[fg=#7d8088]#{b:pane_current_path} #[fg=#3a3c44]│ #[fg=#7d8088]#h #[fg=#3a3c44]│ #[fg=#d0d2d0]%H:%M "

# panes
set -g pane-border-lines single
set -g pane-border-indicators arrows
set -g pane-border-style        'fg=#3a3c44'
set -g pane-active-border-style 'fg=#00e5ff'
set -g display-panes-colour        '#4a4c54'
set -g display-panes-active-colour '#00e5ff'

# popups and menus
set -g popup-border-lines rounded
set -g popup-border-style 'fg=#00e5ff'
set -g menu-border-lines rounded
set -g menu-style          'bg=#18191d,fg=#d0d2d0'
set -g menu-selected-style 'bg=#00e5ff,fg=#18191d'
set -g menu-border-style   'fg=#00e5ff'

# messages, prompt, selection
set -g message-style         'bg=default,fg=#00e5ff'
set -g message-command-style 'bg=default,fg=#e0af68'
set -g mode-style            'bg=#00e5ff,fg=#18191d'
setw -g copy-mode-match-style         'bg=#4a4c54,fg=#d0d2d0'
setw -g copy-mode-current-match-style 'bg=#e0af68,fg=#18191d'
setw -g clock-mode-colour '#00e5ff'
