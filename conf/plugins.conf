# Plugins (tpm). They live outside this repo, in ~/.local/share/tmux/plugins.
# tpm is cloned and the plugins installed automatically on the first start.

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

# The plugin list is in tmux.conf: tpm reads it from that file's text.

# sessions survive a reboot: windows, panes, folders, and these programs are restarted
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
# off: it would save everything on screen (tokens printed by `cat .env`, `env`, …) to disk,
# unencrypted, every 15 min. Windows, panes, folders and programs are still restored.
set -g @resurrect-capture-pane-contents 'off'
set -g @resurrect-processes 'lazygit btop k9s ssh "~uv run" "~go run" "~make run-server"'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# extrakto: popup, copy through the terminal (works on macOS, Wayland, ssh)
set -g @extrakto_split_direction 'p'
set -g @extrakto_popup_size '70%,50%'
set -g @extrakto_clip_tool_run 'tmux_osc52'
set -g @extrakto_fzf_layout 'reverse'

# tpm installs plugins only right after it is cloned, so if tpm already existed (or that
# first install failed) the plugins stayed missing for good. install_plugins skips what is
# installed and downloads only what's missing. In the background (-b): the check takes ~100 ms;
# a newly added plugin is active from the next start or reload (prefix r).
if-shell "test ! -d $HOME/.local/share/tmux/plugins/tpm" {
  run-shell "git clone --depth=1 -q https://github.com/tmux-plugins/tpm $HOME/.local/share/tmux/plugins/tpm"
}
run-shell -b "$HOME/.local/share/tmux/plugins/tpm/bin/install_plugins >/dev/null 2>&1"
run-shell "$HOME/.local/share/tmux/plugins/tpm/tpm"
