# Key bindings. Everyday things are Alt + key, no prefix needed.
# (macOS: Ghostty's `macos-option-as-alt = left`, so it's the LEFT Option key)
#
# The prefix stays Ctrl-b: Ctrl-a is zsh's beginning-of-line, Ctrl-Space is
# completion in nvim. With the Alt keys you rarely need it anyway.

# ---------- panes: Alt-h/j/k/l moves through tmux panes AND nvim splits ----------
# In a pane running nvim, the key goes to nvim (smart-splits.nvim sets
# @pane-is-vim); at the edge of nvim's splits it moves on to the tmux pane.
# At the edge of the window it stops (no wrapping to the other side).
bind -n M-h if -F '#{@pane-is-vim}' { send-keys M-h } { if -F '#{pane_at_left}'   {} { select-pane -L } }
bind -n M-j if -F '#{@pane-is-vim}' { send-keys M-j } { if -F '#{pane_at_bottom}' {} { select-pane -D } }
bind -n M-k if -F '#{@pane-is-vim}' { send-keys M-k } { if -F '#{pane_at_top}'    {} { select-pane -U } }
bind -n M-l if -F '#{@pane-is-vim}' { send-keys M-l } { if -F '#{pane_at_right}'  {} { select-pane -R } }

# Alt-Shift-h/j/k/l resizes (also nvim splits)
bind -n M-H if -F '#{@pane-is-vim}' { send-keys M-H } { resize-pane -L 3 }
bind -n M-J if -F '#{@pane-is-vim}' { send-keys M-J } { resize-pane -D 2 }
bind -n M-K if -F '#{@pane-is-vim}' { send-keys M-K } { resize-pane -U 2 }
bind -n M-L if -F '#{@pane-is-vim}' { send-keys M-L } { resize-pane -R 3 }

# the same moves while scrolling back in copy mode
bind -T copy-mode-vi M-h select-pane -L
bind -T copy-mode-vi M-j select-pane -D
bind -T copy-mode-vi M-k select-pane -U
bind -T copy-mode-vi M-l select-pane -R

# splits open in the current folder:  Alt-\ right, Alt-- down (prefix | and - too)
bind -n 'M-\' split-window -h -c '#{pane_current_path}'
bind -n M--   split-window -v -c '#{pane_current_path}'
bind '|'      split-window -h -c '#{pane_current_path}'
bind '\'      split-window -h -c '#{pane_current_path}'
bind -        split-window -v -c '#{pane_current_path}'
bind -n M-z   resize-pane -Z                       # zoom the pane (toggle)
bind S        setw synchronize-panes \; display 'sync panes: #{?synchronize-panes,on,off}'

# ---------- windows ----------
bind -n M-c new-window -c '#{pane_current_path}'
bind    c   new-window -c '#{pane_current_path}'
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -r '<' swap-window -d -t -1                   # move the window left / right (repeatable)
bind -r '>' swap-window -d -t +1

# ---------- sessions ----------
# Alt-s: pick a project (open sessions, zoxide, ~/projects) and jump to its session
bind -n M-s display-popup -E -w 70% -h 60% -b rounded -T '#[fg=#00e5ff] sessions ' '~/.config/tmux/bin/tms'
bind    s   choose-tree -Zs -O name                # built-in session tree
bind    X   confirm-before -p 'kill session #S? (y/n)' kill-session

# ---------- popups ----------
# Alt-g lazygit in this pane's folder; Alt-t a scratch shell (Alt-t again hides it, it keeps running)
bind -n M-g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' -b rounded -T '#[fg=#00e5ff] lazygit ' lazygit
bind -n M-t if -F '#{==:#{session_name},scratch}' { detach-client } {
  display-popup -E -w 80% -h 75% -d '#{pane_current_path}' -b rounded -T '#[fg=#00e5ff] scratch · Alt-t hides ' 'tmux new-session -A -s scratch'
}
bind b display-popup -E -w 90% -h 90% -b rounded -T '#[fg=#00e5ff] btop ' btop
bind K display-popup -E -w 90% -h 90% -b rounded -T '#[fg=#00e5ff] k9s ' 'command -v k9s >/dev/null && k9s || { echo "k9s is not installed"; read -r _; }'

# ---------- copy mode (vi keys; copies go to the system clipboard) ----------
bind -n M-v copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel
bind -T copy-mode-vi Y      send -X copy-line-and-cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line
bind -T copy-mode-vi Escape send -X cancel

# ---------- misc ----------
bind r source-file ~/.config/tmux/tmux.conf \; display '#[fg=#00e5ff]› config reloaded'
bind C-l send-keys C-l \; clear-history             # clear the screen and the scrollback

# ---------- menu: prefix Space (everything above, findable) ----------
bind Space display-menu -T '#[align=centre,fg=#00e5ff] tmux ' -x C -y C \
  'sessions'                 s { display-popup -E -w 70% -h 60% -b rounded -T '#[fg=#00e5ff] sessions ' '~/.config/tmux/bin/tms' } \
  'lazygit'                  g { display-popup -E -w 90% -h 90% -d '#{pane_current_path}' -b rounded lazygit } \
  'scratch shell'            t { display-popup -E -w 80% -h 75% -d '#{pane_current_path}' -b rounded 'tmux new-session -A -s scratch' } \
  'btop'                     b { display-popup -E -w 90% -h 90% -b rounded btop } \
  '' \
  'split right'              | { split-window -h -c '#{pane_current_path}' } \
  'split down'               - { split-window -v -c '#{pane_current_path}' } \
  'zoom pane'                z { resize-pane -Z } \
  'next layout'          Space { next-layout } \
  '#{?synchronize-panes,stop,start} typing in all panes' S { setw synchronize-panes } \
  'rename window'            , { command-prompt -I '#W' { rename-window -- '%%' } } \
  'kill pane'                x { kill-pane } \
  '' \
  'save sessions now'      C-s { run-shell '~/.local/share/tmux/plugins/tmux-resurrect/scripts/save.sh' } \
  'restore saved sessions' C-r { run-shell '~/.local/share/tmux/plugins/tmux-resurrect/scripts/restore.sh' } \
  'install / update plugins' I { run-shell '~/.local/share/tmux/plugins/tpm/bin/install_plugins && ~/.local/share/tmux/plugins/tpm/bin/update_plugins all' } \
  'reload config'            r { source-file ~/.config/tmux/tmux.conf ; display '#[fg=#00e5ff]› config reloaded' }
