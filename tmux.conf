# ┌──────────────────────────────────────────────────────────────┐
# │ tmux · archminimal                                            │
# │ ~/.config/tmux → this repo. Everything is in conf/.           │
# │ prefix: Ctrl-b   menu: prefix Space   keys: README.md         │
# └──────────────────────────────────────────────────────────────┘

# Paths are relative to this file, so the repo works linked or not.
source-file -F '#{d:current_file}/conf/options.conf'
source-file -F '#{d:current_file}/conf/keys.conf'
source-file -F '#{d:current_file}/conf/theme.conf'

# Plugin list. It must be in this file: tpm finds plugins by reading the text of
# ~/.config/tmux/tmux.conf and can't follow the `source-file -F` lines above, so
# listed in conf/plugins.conf it saw none and installed / loaded nothing.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix C-s save / C-r restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # …automatically: saved every 15 min, restored on start
set -g @plugin 'laktak/extrakto'               # prefix Tab: fuzzy-pick a path / URL / word from the screen

# plugins last: continuum hooks into the status line the theme just built
# (skipped by `make check`, which must not touch the network)
if-shell '[ -z "$TMUX_CONFIG_CHECK" ]' {
  source-file -F '#{d:current_file}/conf/plugins.conf'
}
